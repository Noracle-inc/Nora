<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noracle | Budget Whisperer</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-light-starry">
    <div class="stars" aria-hidden="true"></div>
    <main class="container page-shell">
      <div class="card page-card">
        <div class="feature-header">
          <a href="dashboard.html" class="back-link">← Back</a>
          <div>
            <p class="eyebrow">Gentle planning</p>
            <h1>Budget Whisperer</h1>
          </div>
        </div>

        <div class="budget-grid">
          <article class="budget-card">
            <h3>Monthly mood</h3>
            <p id="budget-mood">Your plan is trying to be kind, not strict.</p>
          </article>
          <article class="budget-card">
            <h3>Spending check</h3>
            <p id="budget-suggestion">Review essentials first, then leave a small cushion.</p>
          </article>
        </div>
      </div>
    </main>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/budget-whisperer.js"></script>
  </body>
</html>
