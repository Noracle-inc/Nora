<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noracle | Communities</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-dusk">
    <div class="stars" aria-hidden="true"></div>
    <main class="container community-shell">
      <header class="community-header">
        <div>
          <p class="eyebrow">Safe circles</p>
          <h1>Communities</h1>
        </div>

        <div class="identity-panel">
          <div class="identity-status">
            <span class="status-dot"></span>
            <span id="anon-status">You are anonymous by default.</span>
          </div>
          <button class="btn secondary" id="toggle-identity" type="button">Change visibility</button>
        </div>
      </header>

      <section class="community-layout">
        <aside class="panel community-sidebar">
          <div class="sidebar-heading">
            <h2>Subcommunities</h2>
            <span class="small-label">Anonymous-first</span>
          </div>
          <div id="group-list" class="group-list"></div>
        </aside>

        <section class="panel community-feed">
          <div class="community-hero">
            <div>
              <p class="eyebrow" id="selected-tag">Featured</p>
              <h2 id="selected-name">Choose a circle</h2>
            </div>
            <button class="btn primary" id="join-community" type="button">Join anonymously</button>
          </div>

          <div id="community-detail" class="community-detail"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/community.js"></script>
  </body>
</html>
