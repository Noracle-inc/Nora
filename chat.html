<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noracle | Nora AI</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/chat.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-dusk">
    <div class="stars" aria-hidden="true"></div>
    <header class="topbar narrow">
      <nav class="nav container">
        <a class="brand" href="dashboard.html">
          <span class="brand-mark">N</span>
          <span>Noracle</span>
        </a>
      </nav>
    </header>

    <main class="container chat-shell">
      <aside class="chat-sidebar card">
        <h2>Conversations</h2>
        <p>Saved conversations appear here when you opt in to history.</p>
        <ul id="conversation-list"></ul>
      </aside>

      <section class="chat-panel card">
        <div class="chat-header">
          <h2>Nora</h2>
          <button id="new-chat" class="btn ghost" type="button">New chat</button>
        </div>
        <div class="chat-messages" id="chat-messages" aria-live="polite">
          <div class="message bot">Hello, you. Want to tell me what feels heavy right now?</div>
        </div>
        <p id="chat-status" class="muted-copy" role="status" aria-live="polite">
          Messages are not saved to your account unless you enable conversation history in Settings.
        </p>
        <form class="chat-input-row" id="chat-form">
          <input aria-label="Message Nora" type="text" id="chat-input" placeholder="Message Nora..." />
          <button class="btn primary" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/chat.js"></script>
  </body>
</html>
