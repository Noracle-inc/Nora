<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noracle | Scream room</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-light-starry">
    <div class="stars" aria-hidden="true"></div>
    <main class="container page-shell scream-room">
      <div class="card page-card scream-card">
        <div class="scream-header">
          <div>
            <p class="eyebrow">Private release</p>
            <h1>Scream room</h1>
          </div>
          <button class="btn danger" id="clear-room" type="button">Clear</button>
        </div>

        <div class="scream-banner">
          <span class="banner-pill">No memory after exit</span>
          <p>You are allowed to be human here. This room clears itself when you leave.</p>
        </div>

        <div class="scream-controls">
          <button class="btn primary" id="record-button" type="button">Start voice note</button>
          <button class="btn secondary hidden" id="stop-recording" type="button">Stop recording</button>
          <span id="record-status">Voice notes stay only for this session.</span>
        </div>

        <label class="field-label">
          Text message
          <textarea id="scream-text" aria-label="Scream room text message" placeholder="Write what you need to get out of your chest..."></textarea>
        </label>

        <div class="scream-actions">
          <button class="btn primary" id="save-text" type="button">Save this moment</button>
          <button class="btn ghost" id="clear-text" type="button">Clear text</button>
        </div>

        <div id="voice-list" class="voice-list" aria-live="polite"></div>
      </div>
    </main>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/scream-room.js"></script>
  </body>
</html>
