<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noracle | Vault</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-light-starry">
    <div class="stars" aria-hidden="true"></div>
    <main class="container page-shell">
      <div class="card page-card">
        <div class="feature-header">
          <a href="dashboard.html" class="back-link">← Back</a>
          <div>
            <p class="eyebrow">Private archive</p>
            <h1>Vault</h1>
          </div>
        </div>

        <div class="vault-grid">
          <article class="vault-item">
            <h3>Private notes</h3>
            <p>Saved thoughts live here until you decide to clear them.</p>
          </article>
          <article class="vault-item">
            <h3>Protected space</h3>
            <p>Nothing is shared automatically or exposed to the wider app.</p>
          </article>
        </div>
      </div>
    </main>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/vault.js"></script>
  </body>
</html>
